services:
  - type: web
    name: todo-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npx pnpm@12.4.1 install --frozen-lockfile && npx pnpm@12.4.1 --filter @sakshamthakur/light-orm build && npx pnpm@12.4.1 --filter todo-api build
    startCommand: node apps/todo-app/dist/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: 4000
